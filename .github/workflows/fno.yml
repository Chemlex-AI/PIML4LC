name: FNO software checks
on:
  push:
    paths: ['FNO/**', '.github/workflows/fno.yml']
  pull_request:
    paths: ['FNO/**', '.github/workflows/fno.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: FNO
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: FNO/requirements*.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
