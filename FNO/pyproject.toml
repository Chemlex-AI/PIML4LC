[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piml4lc-fno"
version = "0.1.0"
description = "Parameter-conditioned autoregressive FNO for chromatography"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]
license = {text = "BSD-3-Clause; third-party components retain their own licenses"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*", "configs*"]

[tool.setuptools.package-data]
configs = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
