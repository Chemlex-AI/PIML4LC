_target_: lightning.pytorch.Trainer
default_root_dir: ${paths.output_dir}
accelerator: auto
devices: 1
strategy: auto
precision: 32-true
min_epochs: 50
max_epochs: 1000
gradient_clip_val: 1.0
num_sanity_val_steps: 0
check_val_every_n_epoch: 1
log_every_n_steps: 1
deterministic: false
enable_progress_bar: true
